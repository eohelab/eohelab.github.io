<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>欢迎本科生金显加入课题组</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body{background:#f7f6f2}.article{max-width:960px;margin:auto;padding:48px 5vw 90px}.top{display:flex;justify-content:space-between;align-items:center}.back,.lang{color:#24312f;font-size:14px}.lang{border:1px solid #ccd4ce;background:transparent;padding:8px 12px;cursor:pointer}.article .eyebrow{margin-top:56px}.article h1{font-size:clamp(30px,4.5vw,52px);line-height:1.3;margin:18px 0 32px}.welcome{display:grid;grid-template-columns:220px 1fr;gap:36px;align-items:start;border-top:1px solid #d4dbd6;padding-top:32px}.portrait{width:100%;height:auto;display:block}.body{font-size:17px;line-height:1.9;color:#354841}.body p{margin:0 0 22px}.members-link{color:#24312f;text-underline-offset:5px}@media(max-width:600px){.welcome{grid-template-columns:1fr;gap:24px}.portrait{max-width:220px;margin:auto}.body{font-size:16px}}
  </style>
</head>
<body>
  <main class="article">
    <div class="top"><a class="back" href="index.html" data-k="back">← 返回首页</a><button class="lang" id="lang" aria-label="Switch language">EN</button></div>
    <p class="eyebrow" data-k="date">成员动态 · 2026 年 9 月 17 日</p>
    <h1 data-k="title">欢迎本科生金显加入课题组</h1>
    <div class="welcome">
      <img class="portrait" src="assets/jin-xian.jpg" alt="金显 / Xian Jin" width="358" height="441">
      <div class="body">
        <p data-k="intro">欢迎金显加入地球观测与人类环境课题组！金显目前为大四本科生，暂定研究方向为北极地表变化监测。</p>
        <p data-k="welcome">期待金显带着好奇心与新的问题，在遥感观测与地表变化研究中探索、学习，与课题组伙伴一起理解正在变化的北极。欢迎加入！</p>
        <a class="members-link" href="index.html#people" data-k="people">认识课题组成员 ↗</a>
      </div>
    </div>
  </main>
  <script>
    const copy={zh:{back:'← 返回首页',date:'成员动态 · 2026 年 9 月 17 日',title:'欢迎本科生金显加入课题组',intro:'欢迎金显加入地球观测与人类环境课题组！金显目前为大四本科生，暂定研究方向为北极地表变化监测。',welcome:'期待金显带着好奇心与新的问题，在遥感观测与地表变化研究中探索、学习，与课题组伙伴一起理解正在变化的北极。欢迎加入！',people:'认识课题组成员 ↗'},en:{back:'← Back to home',date:'NEW MEMBER · 17 SEPTEMBER 2026',title:'Welcome undergraduate student Xian Jin to the lab',intro:'We welcome Xian Jin to the Earth Observation & Human Environment Lab! Xian is a fourth-year undergraduate student whose tentative research focus is monitoring Arctic land-surface change.',welcome:'We look forward to the curiosity and fresh questions Xian will bring as he explores remote sensing and land-surface change, and works with the group to understand a changing Arctic. Welcome aboard!',people:'Meet the group ↗'}};
    let lang='zh';document.getElementById('lang').addEventListener('click',()=>{lang=lang==='zh'?'en':'zh';document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.querySelectorAll('[data-k]').forEach(el=>el.textContent=copy[lang][el.dataset.k]);document.title=copy[lang].title;document.getElementById('lang').textContent=lang==='zh'?'EN':'中'});
  </script>
</body>
</html>
